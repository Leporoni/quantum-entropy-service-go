services:
  # ==================== QUANTUM API ====================
  quantum-api:
    build:
      context: .
      dockerfile: Dockerfile.api
      network: host
    container_name: quantum-api
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - quantum-net
    restart: unless-stopped

  # ==================== KEY MANAGER ====================
  keymanager:
    build:
      context: .
      dockerfile: Dockerfile.keymanager
      network: host
    container_name: quantum-keymanager
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - MASTER_KEY_SECRET=super_secret_master_key_change_me_in_prod
      - API_BASE_URL=http://quantum-api:8081
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      quantum-api:
        condition: service_started
    networks:
      - quantum-net
    restart: unless-stopped

  # ==================== RABBITMQ ====================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quantum-net
    restart: unless-stopped

networks:
  quantum-net:
    driver: bridge
